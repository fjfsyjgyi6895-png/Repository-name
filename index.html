<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title> تطبيقي</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      text-align: center;
    }

    .header {
      background: #2196f3;
      color: white;
      padding: 25px;
      font-size: 28px;
      font-weight: bold;
    }

    .container {
      padding: 30px 20px;
    }

    .card {
      background: white;
      padding: 25px;
      margin: 20px auto;
      max-width: 400px;
      border-radius: 15px;
      box-shadow: 0 3px 10px rgba(0,0,0,0.1);
    }

    button {
      background: #2196f3;
      color: white;
      border: none;
      padding: 14px 30px;
      border-radius: 10px;
      font-size: 18px;
      cursor: pointer;
    }

    button:hover {
      background: #1976d2;
    }
  </style>
</head>

<body>

  <div class="header">
    مرحباً بك في تطبيقي
  </div>

  <div class="container">

    <div class="card">
      <h2>أهلاً وسهلاً 👋</h2>
      <p>هذا هو أول إصدار من تطبيقي.</p>

      <button onclick="showMessage()">
        اضغط هنا
      </button>
    </div>

  </div>

  <script>
    function showMessage() {
      alert("مرحباً بك! التطبيق يعمل بنجاح 🎉");
    }
  </script>

</body>
</html>
